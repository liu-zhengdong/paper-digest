name: daily-paper-digest

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build digest and RSS
        run: python3 digest.py
      - name: Publish output
        run: |
          git config user.name "paper-digest"
          git config user.email "paper-digest@users.noreply.github.com"
          git add output
          git diff --cached --quiet && exit 0
          git commit -m "digest: $(date -u +%F)"
          git push
