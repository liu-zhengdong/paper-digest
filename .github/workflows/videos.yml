name: daily-agent-videos

on:
  schedule:
    - cron: "45 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build agent video digest
        run: python3 videos.py
      - name: Publish output
        run: |
          git config user.name "paper-digest"
          git config user.email "paper-digest@users.noreply.github.com"
          git add output/videos.md output/videos.xml output/videos.json
          git diff --cached --quiet && exit 0
          git commit -m "videos: $(date -u +%F)"
          git push
